name: VSA Radar RSS Collector
on:
  schedule:
    - cron: "15 13 * * *" # 10:15 America/Campo_Grande (UTC-3); adjust for daylight/region policy.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - name: Install dependencies
        run: pip install -r collector/requirements.txt
      - name: Collect RSS / Atom
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VSA_OWNER_ID: ${{ secrets.VSA_OWNER_ID }}
        run: python collector/collect.py
